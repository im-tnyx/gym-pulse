name: Foundation PostgreSQL Validation

on:
  push:
    branches:
      - validation/postgres-foundation-20260929

permissions:
  contents: read

jobs:
  real-postgres-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      POSTGRES_IMAGE: postgres:17-bookworm
      PGPORT: "55432"
    steps:
      - name: Checkout validation branch
        uses: actions/checkout@v4

      - name: Set up validation Node runtime
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Execute Real PostgreSQL Foundation Validation
        shell: bash
        run: bash validation/foundation/postgres/scripts/run-validation.sh

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foundation-postgres-evidence
          path: validation/foundation/postgres/results/
          if-no-files-found: warn
          retention-days: 7
